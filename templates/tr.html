<section class="customer-reviews">
  <h2 class="reviews-title">What Our Customers Say</h2>
  {% if user.is_authenticated %}
      <form class="review-form" id="reviewForm" action="{% url 'submit_review' product.uid %}" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="star-rating-container">
              <p class="rating-label">Rate your experience:</p>
              <div class="star-rating">
                  <input type="radio" id="star5" name="rating" value="5" required>
                  <label for="star5" title="5 stars"></label>
                  <input type="radio" id="star4" name="rating" value="4">
                  <label for="star4" title="4 stars"></label>
                  <input type="radio" id="star3" name="rating" value="3">
                  <label for="star3" title="3 stars"></label>
                  <input type="radio" id="star2" name="rating" value="2">
                  <label for="star2" title="2 stars"></label>
                  <input type="radio" id="star1" name="rating" value="1">
                  <label for="star1" title="1 star"></label>
              </div>
          </div>
          <div class="review-text-container">
              <textarea class="review-text" name="text" id="reviewText" placeholder="Share your thoughts about the product..." rows="4" required aria-label="Review text"></textarea>
          </div>
          <div id="reviewPreview" class="review-preview" aria-live="polite" style="display: none;">
              <h3>Review Preview</h3>
              <div class="preview-rating"></div>
              <p class="preview-text"></p>
          </div>
          <div class="media-upload-container">
              <label for="reviewMedia" class="media-label">
                  <span class="media-icon" aria-hidden="true">📷</span>
                  Add Photos or Videos
              </label>
              <input type="file" id="reviewMedia" class="review-media" name="media" accept="image/*,video/*" aria-label="Upload media" multiple>
              <div id="mediaPreview" class="media-preview" aria-live="polite"></div>
          </div>
          <input type="hidden" name="product_id" value="{{ product.uid }}">
          <button type="submit" class="submit-review">Post Your Review</button>
      </form>
  {% else %}
      <div class="login-prompt">
          <p>Want to share your thoughts?</p>
          <a href="{% url 'login' %}" class="login-link">Log in to write a review</a>
      </div>
  {% endif %}
  <div class="reviews-list" id="reviewsList"></div>
</section>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const reviewForm = document.getElementById('reviewForm');
  const reviewsList = document.getElementById('reviewsList');
  const mediaInput = document.getElementById('reviewMedia');
  const mediaPreview = document.getElementById('mediaPreview');
  const reviewText = document.getElementById('reviewText');
  const reviewPreview = document.getElementById('reviewPreview');
  const previewRating = reviewPreview.querySelector('.preview-rating');
  const previewText = reviewPreview.querySelector('.preview-text');

  if (reviewForm) {
      reviewForm.addEventListener('submit', function(e) {
          e.preventDefault();
          const formData = new FormData(this);
          fetch('{% url "submit_review" product.uid %}', {
              method: 'POST',
              body: formData,
              headers: {
                  'X-CSRFToken': formData.get('csrfmiddlewaretoken')
              }
          })
          .then(response => response.json())
          .then(data => {
              if (data.message === 'Review submitted successfully') {
                  alert('Your review has been posted successfully!');
                  loadReviews();
                  reviewForm.reset();
                  mediaPreview.innerHTML = '';
                  reviewPreview.style.display = 'none';
              } else {
                  alert('Error submitting review. Please try again.');
              }
          })
          .catch(error => {
              console.error('Error:', error);
              alert('An error occurred. Please try again.');
          });
      });
  }

  if (mediaInput) {
      mediaInput.addEventListener('change', function(e) {
          mediaPreview.innerHTML = '';
          for (let i = 0; i < this.files.length; i++) {
              const file = this.files[i];
              const reader = new FileReader();
              reader.onload = function(e) {
                  const mediaElement = file.type.startsWith('image/')
                      ? `<img src="${e.target.result}" alt="Preview">`
                      : `<video src="${e.target.result}" controls></video>`;
                  mediaPreview.innerHTML += mediaElement;
              }
              reader.readAsDataURL(file);
          }
      });
  }

  if (reviewText) {
      reviewText.addEventListener('input', updateReviewPreview);
  }

  if (reviewForm) {
      reviewForm.addEventListener('change', updateReviewPreview);
  }

  function updateReviewPreview() {
      const rating = document.querySelector('input[name="rating"]:checked');
      const text = reviewText.value;
      if (rating || text) {
          reviewPreview.style.display = 'block';
          previewRating.innerHTML = rating ? '★'.repeat(rating.value) + '☆'.repeat(5 - rating.value) : '';
          previewText.textContent = text;
      } else {
          reviewPreview.style.display = 'none';
      }
  }

  function loadReviews() {
      fetch('{% url "get_reviews" product.uid %}')
      .then(response => response.json())
      .then(data => {
          reviewsList.innerHTML = '';
          data.reviews.forEach(review => {
              const reviewElement = document.createElement('div');
              reviewElement.className = 'review-item';
              reviewElement.innerHTML = `
                  <div class="review-header">
                      <span class="review-author">${review.user}</span>
                      <span class="review-date">${new Date(review.created_at).toLocaleDateString()}</span>
                  </div>
                  <div class="review-rating">${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}</div>
                  <div class="review-content">${review.text}</div>
                  ${review.media ? `
                      <div class="review-media">
                          ${review.media.map(mediaUrl =>
                              mediaUrl.endsWith('.mp4')
                              ? `<video src="${mediaUrl}" controls></video>`
                              : `<img src="${mediaUrl}" alt="Review media">`
                          ).join('')}
                      </div>
                  ` : ''}
                  ${review.can_delete ? `<button class="delete-review" data-review-id="${review.id}">Delete</button>` : ''}
              `;
              reviewsList.appendChild(reviewElement);
          });
          addDeleteListeners();
      })
      .catch(error => console.error('Error:', error));
  }

  function addDeleteListeners() {
      const deleteButtons = document.querySelectorAll('.delete-review');
      deleteButtons.forEach(button => {
          button.addEventListener('click', function() {
              const reviewId = this.dataset.reviewId;
              if (confirm('Are you sure you want to delete this review?')) {
                  deleteReview(reviewId);
              }
          });
      });
  }

  function deleteReview(reviewId) {
      fetch(`{% url "delete_review" 0 %}`.replace('0', reviewId), {
          method: 'POST',
          headers: {
              'X-CSRFToken': '{{ csrf_token }}'
          }
      })
      .then(response => response.json())
      .then(data => {
          if (data.message === 'Review deleted successfully') {
              loadReviews();
          } else {
              alert('Error deleting review. Please try again.');
          }
      })
      .catch(error => {
          console.error('Error:', error);
          alert('An error occurred. Please try again.');
      });
  }

  loadReviews();
});
</script>
